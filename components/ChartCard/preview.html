<!-- @dsCard group="Data display" height=240 subtitle="revenue line vs previous period, with legend and tooltip" -->
<div id="root" style="padding:16px;font-family:var(--font-sans);color:var(--foreground);background:var(--background)">
<style>
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.hd h3{margin:0;font:500 16px/24px var(--font-sans)}.hd .sub{font:400 13px/18px var(--font-sans);color:var(--muted-foreground)}
.lg{display:flex;gap:16px;font:400 13px/18px var(--font-sans);color:var(--muted-foreground)}
.lg i{display:inline-block;width:12px;height:2px;vertical-align:middle;margin-right:6px}
svg{width:100%;height:140px;font:400 11px var(--font-sans)}
.grid{stroke:var(--border)}.tick{fill:var(--muted-foreground)}
.s1{fill:none;stroke:var(--chart-1);stroke-width:2}.s2{fill:none;stroke:var(--chart-2);stroke-width:1.5;stroke-dasharray:4 3}
.a1{fill:var(--chart-1);opacity:.12}
.hl{stroke:var(--muted-foreground);stroke-dasharray:2 2}
.tt{fill:var(--popover);stroke:var(--border)}.ttx{fill:var(--foreground);font:400 11px var(--font-mono)}.ttc{fill:var(--muted-foreground)}
</style>
<div class="card">
<div class="hd"><div><h3>Revenue overview</h3><div class="sub">GH₵633,000 this period · ↗ 7.7%</div></div><div class="lg"><span><i style="background:var(--chart-1)"></i>This year</span><span><i style="background:var(--chart-2)"></i>Previous year</span></div></div>
<svg viewBox="0 0 600 140" preserveAspectRatio="none">
<g class="grid"><line x1="40" y1="20" x2="600" y2="20"/><line x1="40" y1="60" x2="600" y2="60"/><line x1="40" y1="100" x2="600" y2="100"/></g>
<g class="tick"><text x="0" y="24">80K</text><text x="0" y="64">40K</text><text x="0" y="104">0</text><text x="40" y="132">Jan</text><text x="180" y="132">Apr</text><text x="320" y="132">Jul</text><text x="460" y="132">Oct</text><text x="575" y="132">Dec</text></g>
<path class="a1" d="M40 80L110 72 180 76 250 58 320 62 390 44 460 40 530 30 600 24V100H40Z"/>
<path class="s2" d="M40 90L110 84 180 88 250 76 320 78 390 66 460 64 530 58 600 54"/>
<path class="s1" d="M40 80L110 72 180 76 250 58 320 62 390 44 460 40 530 30 600 24"/>
<line class="hl" x1="390" y1="20" x2="390" y2="100"/>
<circle cx="390" cy="44" r="3" fill="var(--chart-1)"/><circle cx="390" cy="66" r="3" fill="var(--chart-2)"/>
<rect class="tt" x="404" y="28" width="132" height="46" rx="4"/>
<text class="ttc" x="412" y="42" style="font:500 11px var(--font-sans)">Aug 2026</text>
<text class="ttx" x="412" y="56">This year   62,400</text><text class="ttx" x="412" y="68">Previous   47,100</text>
</svg>
</div>
</div>
<script>/* static */</script>
