<!-- @dsCard group="Feedback" height=170 subtitle="stat tile, table rows and a text block loading" -->
<div id="root" style="padding:16px;display:grid;grid-template-columns:200px 1fr 220px;gap:16px;font-family:var(--font-sans);background:var(--background)">
<style>
.sk{background:var(--muted);border-radius:var(--radius-sm);position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--accent),transparent);transform:translateX(-100%);animation:sh 1.6s infinite}
@keyframes sh{to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.sk::after{animation:none}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;gap:8px}
.tbl{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.th{background:var(--secondary);border-bottom:1px solid var(--border);padding:10px 12px;font:500 12px/16px var(--font-sans);letter-spacing:.02em;color:var(--muted-foreground);display:grid;grid-template-columns:2fr 1fr 1fr}
.tr{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;padding:10px 12px;border-bottom:1px solid var(--border)}
.tr .sk{height:14px}
</style>
<div class="card"><div class="sk" style="width:60%;height:12px"></div><div class="sk" style="width:80%;height:28px"></div><div class="sk" style="width:40%;height:12px"></div><div class="sk" style="height:28px;margin-top:4px"></div></div>
<div class="tbl"><div class="th"><span>USER</span><span>ROLE</span><span>STATUS</span></div>
<div class="tr"><div class="sk" style="width:70%"></div><div class="sk" style="width:60%"></div><div class="sk" style="width:50%"></div></div>
<div class="tr"><div class="sk" style="width:55%"></div><div class="sk" style="width:65%"></div><div class="sk" style="width:45%"></div></div>
<div class="tr"><div class="sk" style="width:80%"></div><div class="sk" style="width:50%"></div><div class="sk" style="width:55%"></div></div>
<div class="tr" style="border:0"><div class="sk" style="width:62%"></div><div class="sk" style="width:58%"></div><div class="sk" style="width:48%"></div></div></div>
<div style="display:flex;flex-direction:column;gap:8px"><div class="sk" style="width:50%;height:20px"></div><div class="sk" style="width:90%;height:14px"></div><div class="sk" style="width:85%;height:14px"></div><div class="sk" style="width:70%;height:14px"></div></div>
</div>
<script>/* static */</script>
