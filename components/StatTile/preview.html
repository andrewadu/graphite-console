<!-- @dsCard group="Data display" height=150 subtitle="four tiles: up, up, down-is-bad, down-is-good" -->
<div id="root" style="padding:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;font-family:var(--font-sans);color:var(--foreground);background:var(--background)">
<style>
.t{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;gap:4px}
.t .cap{font:500 12px/16px var(--font-sans);letter-spacing:.02em;color:var(--muted-foreground)}
.t .val{font:600 24px/32px var(--font-sans);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.t .d{display:inline-flex;align-items:center;gap:2px;font:500 12px/16px var(--font-sans);color:var(--muted-foreground)}
.t .d.up{color:var(--success)}.t .d.down{color:var(--destructive)}
.t svg.sp{width:100%;height:28px;margin-top:4px}
.t svg.sp path{fill:none;stroke:var(--chart-1);stroke-width:1.5}.t svg.sp line{stroke:var(--chart-5)}
</style>
<div class="t"><span class="cap">MONTHLY REVENUE</span><span class="val">GH₵189,540</span><span class="d up">↗ 27.9%</span><svg class="sp" viewBox="0 0 100 28" preserveAspectRatio="none"><line x1="0" y1="27" x2="100" y2="27"/><path d="M0 20L15 18 30 21 45 14 60 15 75 9 90 10 100 4"/></svg></div>
<div class="t"><span class="cap">ORDERS FULFILLED</span><span class="val">21,847</span><span class="d up">↗ 18.4%</span><svg class="sp" viewBox="0 0 100 28" preserveAspectRatio="none"><line x1="0" y1="27" x2="100" y2="27"/><path d="M0 22L15 20 30 19 45 16 60 17 75 12 90 11 100 8"/></svg></div>
<div class="t"><span class="cap">ACTIVE SESSIONS</span><span class="val">3,112</span><span class="d down">↘ 4.1%</span><svg class="sp" viewBox="0 0 100 28" preserveAspectRatio="none"><line x1="0" y1="27" x2="100" y2="27"/><path d="M0 8L15 10 30 9 45 14 60 13 75 17 90 18 100 20"/></svg></div>
<div class="t"><span class="cap">FAILED JOBS</span><span class="val">14</span><span class="d up">↘ 62%</span><svg class="sp" viewBox="0 0 100 28" preserveAspectRatio="none"><line x1="0" y1="27" x2="100" y2="27"/><path d="M0 6L15 9 30 8 45 15 60 14 75 19 90 22 100 23"/></svg></div>
</div>
