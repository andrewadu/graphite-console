<!-- @dsCard group="Actions" height=130 subtitle="shortcut legend" -->
<div id="root" style="padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px 32px;font-family:var(--font-sans);color:var(--foreground);background:var(--background);font:400 14px/20px var(--font-sans)">
<style>
.r{display:flex;justify-content:space-between;align-items:center;height:28px}
kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;font:400 11px/1 var(--font-mono);color:var(--muted-foreground);background:var(--secondary);border:1px solid var(--border);border-radius:var(--radius-sm)}
.k{display:inline-flex;gap:4px;align-items:center}.then{font:400 12px/16px var(--font-sans);color:var(--muted-foreground);margin:0 2px}
</style>
<div class="r"><span>Command palette</span><span class="k"><kbd>⌘</kbd><kbd>K</kbd></span></div>
<div class="r"><span>Go to users</span><span class="k"><kbd>G</kbd><span class="then">then</span><kbd>U</kbd></span></div>
<div class="r"><span>Focus search</span><span class="k"><kbd>/</kbd></span></div>
<div class="r"><span>Select row</span><span class="k"><kbd>X</kbd></span></div>
<div class="r"><span>Shortcuts</span><span class="k"><kbd>?</kbd></span></div>
<div class="r"><span>Close / cancel</span><span class="k"><kbd>Esc</kbd></span></div>
</div>
<script>/* static */</script>
