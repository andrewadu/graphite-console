<!-- @dsCard group="Data display" height=230 subtitle="users table with selection, status, amounts and row actions" -->
<div id="root" style="padding:16px;font-family:var(--font-sans);color:var(--foreground);background:var(--background)">
<style>
.tbl{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card);overflow:hidden;font:400 14px/20px var(--font-sans)}
.tbl th{background:var(--secondary);color:var(--muted-foreground);font:500 12px/16px var(--font-sans);letter-spacing:.02em;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--muted)}
.tbl tr.sel td{background:var(--accent)}
.num{text-align:right;font-family:var(--font-mono);font-size:13px;font-variant-numeric:tabular-nums}
.id{font-family:var(--font-mono);font-size:13px;color:var(--muted-foreground)}
.b{display:inline-flex;align-items:center;gap:6px;font:500 12px/16px var(--font-sans)}
.dot{width:8px;height:8px;border-radius:9999px;background:var(--muted-foreground)}
.ok .dot{background:var(--success)}.warn .dot{background:var(--warning)}.bad .dot{background:var(--destructive)}
.ghost{height:28px;padding:0 8px;border:0;border-radius:var(--radius-md);background:transparent;color:var(--foreground);font:500 13px/20px var(--font-sans);cursor:pointer}.ghost:hover{background:var(--accent)}
input[type=checkbox]{width:14px;height:14px;accent-color:var(--primary);margin:0}
</style>
<table class="tbl">
<thead><tr><th style="width:32px"><input type="checkbox"></th><th>User</th><th>ID</th><th>Role</th><th>Status</th><th class="num">Logins (30d)</th><th></th></tr></thead>
<tbody>
<tr><td><input type="checkbox"></td><td>Ama Mensah</td><td class="id">usr_8f3a92c1</td><td>Administrator</td><td><span class="b ok"><span class="dot"></span>Active</span></td><td class="num">1,204</td><td><button class="ghost">Edit</button></td></tr>
<tr class="sel"><td><input type="checkbox" checked></td><td>Kofi Boateng</td><td class="id">usr_2d71e0aa</td><td>Operator</td><td><span class="b warn"><span class="dot"></span>Pending review</span></td><td class="num">87</td><td><button class="ghost">Edit</button></td></tr>
<tr><td><input type="checkbox"></td><td>Esi Owusu</td><td class="id">usr_c40b5d17</td><td>Auditor</td><td><span class="b bad"><span class="dot"></span>Suspended</span></td><td class="num">0</td><td><button class="ghost">Edit</button></td></tr>
<tr><td><input type="checkbox"></td><td>Yaw Darko</td><td class="id">usr_91ee73f8</td><td>Operator</td><td><span class="b"><span class="dot"></span>Invited</span></td><td class="num">—</td><td><button class="ghost">Edit</button></td></tr>
</tbody>
</table>
</div>
<script>/* static */</script>
