<div id="root" style="padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px;font-family:var(--font-sans);color:var(--foreground);background:var(--background)">
<style>
.f{display:flex;flex-direction:column;gap:4px}
.f label{font:500 12px/16px var(--font-sans);letter-spacing:.02em}
.f textarea{min-height:88px;padding:8px;border:1px solid var(--input);border-radius:var(--radius-md);background:var(--card);color:var(--foreground);font:400 14px/20px var(--font-sans);resize:vertical}
.f textarea.code{font:400 13px/20px var(--font-mono);background:var(--background);white-space:pre}
.f .ft{display:flex;justify-content:space-between;font:400 13px/18px var(--font-sans);color:var(--muted-foreground)}
</style>
