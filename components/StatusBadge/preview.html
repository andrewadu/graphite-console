<!-- @dsCard group="Data display" height=110 subtitle="dot form and tinted form, five tones" -->
<div id="root" style="padding:16px;display:flex;flex-direction:column;gap:16px;font-family:var(--font-sans);color:var(--foreground);background:var(--background)">
<style>
.b{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:var(--radius-sm);font:500 12px/16px var(--font-sans);letter-spacing:.02em;color:var(--foreground)}
.dot{width:8px;height:8px;border-radius:9999px;background:var(--muted-foreground)}
.ok .dot{background:var(--success)}.warn .dot{background:var(--warning)}.bad .dot{background:var(--destructive)}.info .dot{background:var(--chart-2)}
.tint{border:1px solid var(--border);background:var(--secondary)}
.tint.ok{background:color-mix(in srgb,var(--success) 14%,var(--background));color:var(--success);border-color:transparent}
.tint.warn{background:color-mix(in srgb,var(--warning) 22%,var(--background));color:var(--foreground);border-color:transparent}
.tint.bad{background:color-mix(in srgb,var(--destructive) 14%,var(--background));color:var(--destructive);border-color:transparent}
.tint.info{background:color-mix(in srgb,var(--chart-2) 14%,var(--background));color:var(--chart-2);border-color:transparent}
</style>
<div style="display:flex;gap:12px;flex-wrap:wrap">
<span class="b"><span class="dot"></span>Draft</span>
<span class="b ok"><span class="dot"></span>Active</span>
<span class="b warn"><span class="dot"></span>Pending review</span>
<span class="b bad"><span class="dot"></span>Suspended</span>
<span class="b info"><span class="dot"></span>Syncing</span>
</div>
<div style="display:flex;gap:12px;flex-wrap:wrap">
<span class="b tint">Draft</span>
<span class="b tint ok">Active</span>
<span class="b tint warn">Pending review</span>
<span class="b tint bad">Suspended</span>
<span class="b tint info">Syncing</span>
</div>
</div>
<script>/* static */</script>
