<!-- @dsCard group="Forms" height=300 subtitle="trigger, presets and one calendar month" -->
<div id="root" style="padding:16px;font-family:var(--font-sans);color:var(--foreground);background:var(--background);font:400 14px/20px var(--font-sans)">
<style>
.trig{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 8px;border:1px solid var(--input);border-radius:var(--radius-md);background:var(--card);font:400 13px/20px var(--font-mono)}
.trig svg{width:16px;height:16px;stroke:var(--muted-foreground);fill:none;stroke-width:1.75}
.pop{margin-top:8px;display:inline-flex;background:var(--popover);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden}
.pre{width:150px;padding:4px;border-right:1px solid var(--border);display:flex;flex-direction:column}
.pre div{height:32px;padding:0 8px;border-radius:var(--radius-md);display:flex;align-items:center;cursor:pointer}.pre div:hover{background:var(--accent)}.pre .on{background:var(--accent);font-weight:500}
.cal{padding:12px}
.mh{display:flex;justify-content:space-between;align-items:center;font:500 14px/20px var(--font-sans);margin-bottom:8px}
.mh span{color:var(--muted-foreground);cursor:pointer;padding:0 4px}
.g{display:grid;grid-template-columns:repeat(7,32px);text-align:center}
.g .w{font:500 12px/24px var(--font-sans);color:var(--muted-foreground)}
.g .d{height:32px;line-height:32px;font-variant-numeric:tabular-nums}
.g .o{color:var(--muted-foreground);opacity:.5}
.g .in{background:var(--accent)}.g .e{background:var(--primary);color:var(--primary-foreground);border-radius:var(--radius-md)}
.g .t{box-shadow:inset 0 0 0 1px var(--border);border-radius:var(--radius-md)}
.ft{padding:8px 12px;border-top:1px solid var(--border);font:400 12px/16px var(--font-sans);color:var(--muted-foreground);display:flex;justify-content:space-between}
</style>
<span class="trig"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>2026-10-01 → 2026-10-15</span>

<div class="g"><span class="w">Mo</span><span class="w">Tu</span><span class="w">We</span><span class="w">Th</span><span class="w">Fr</span><span class="w">Sa</span><span class="w">Su</span>
<span class="d o">28</span><span class="d o">29</span><span class="d o">30</span><span class="d e">1</span><span class="d in">2</span><span class="d in">3</span><span class="d in">4</span>
<span class="d in">5</span><span class="d in">6</span><span class="d in">7</span><span class="d in">8</span><span class="d in">9</span><span class="d in">10</span><span class="d in">11</span>
<span class="d in">12</span><span class="d in">13</span><span class="d in">14</span><span class="d e t">15</span><span class="d">16</span><span class="d">17</span><span class="d">18</span>
