<!-- @dsCard group="Forms" height=140 subtitle="rest, with helper, error, disabled" -->
<div id="root" style="padding:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;font-family:var(--font-sans);color:var(--foreground);background:var(--background)">
<style>
.f{display:flex;flex-direction:column;gap:4px}
.f label{font:500 12px/16px var(--font-sans);letter-spacing:.02em}
.f input{height:32px;padding:0 8px;border:1px solid var(--input);border-radius:var(--radius-md);background:var(--card);color:var(--foreground);font:400 14px/20px var(--font-sans)}
.f input::placeholder{color:var(--muted-foreground)}
.f input:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-color:var(--ring)}
.f .hint{font:400 13px/18px var(--font-sans);color:var(--muted-foreground)}
.f.error input{border-color:var(--destructive)}.f.error .hint{color:var(--destructive)}
.f input:disabled{background:var(--muted);color:var(--muted-foreground)}
</style>
<div class="f"><label>Email</label><input placeholder="name@company.com"></div>
<div class="f"><label>Display name</label><input value="Ama Mensah"><span class="hint">Shown in audit logs.</span></div>
<div class="f error"><label>API rate limit</label><input value="0"><span class="hint">Must be at least 1 request/second.</span></div>
<div class="f"><label>Tenant ID</label><input value="tnt_4b9e21" disabled><span class="hint">Assigned at creation.</span></div>
</div>
<script>/* static */</script>
