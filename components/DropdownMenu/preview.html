<!-- @dsCard group="Overlays" height=230 subtitle="row actions menu with a destructive group" -->
<div id="root" style="padding:16px;display:flex;gap:16px;align-items:flex-start;font-family:var(--font-sans);color:var(--foreground);background:var(--background)">
<style>
.trig{height:28px;width:28px;border:0;border-radius:var(--radius-md);background:var(--accent);color:var(--foreground);font:600 14px/1 var(--font-sans);cursor:pointer}
.menu{min-width:200px;background:var(--popover);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:4px}
.it{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:var(--radius-md);font:400 14px/20px var(--font-sans);cursor:pointer}
.it:hover,.it.on{background:var(--accent)}
.it svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;color:var(--muted-foreground)}
.it .k{margin-left:auto;font:400 13px/18px var(--font-sans);color:var(--muted-foreground)}
.sep{height:1px;background:var(--border);margin:4px 0}
.des{color:var(--destructive)}.des svg{color:var(--destructive)}
</style>
<button class="trig">⋯</button>
<div class="menu">
<div class="it on"><svg viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16z"/></svg>Edit user<span class="k">E</span></div>
<div class="it"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8"/></svg>Copy user ID<span class="k">⌘C</span></div>
<div class="it"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>View audit log</div>
<div class="sep"></div>
<div class="it"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Reset password</div>
<div class="it"><svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg>Require 2FA</div>
<div class="sep"></div>
<div class="it des"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.5 5.5l13 13"/></svg>Suspend user…</div>
</div>
</div>
<script>/* static */</script>
