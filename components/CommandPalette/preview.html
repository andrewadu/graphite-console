<!-- @dsCard group="Overlays" height=300 subtitle="open palette with a typed query" -->
<div id="root" style="position:relative;height:300px;font-family:var(--font-sans);color:var(--foreground);background:var(--background)">
<style>
.scrim{position:absolute;inset:0;background:color-mix(in srgb,var(--foreground) 40%,transparent);display:flex;justify-content:center;padding-top:24px}
.cp{width:560px;height:fit-content;background:var(--popover);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);overflow:hidden}
.q{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-bottom:1px solid var(--border);font:400 14px/20px var(--font-sans)}
.q svg{width:16px;height:16px;stroke:var(--muted-foreground);fill:none;stroke-width:2}
.q .caret{display:inline-block;width:1px;height:16px;background:var(--foreground)}
.g{padding:8px 4px 4px 12px;font:500 12px/16px var(--font-sans);letter-spacing:.02em;color:var(--muted-foreground)}
.r{display:flex;align-items:center;gap:8px;height:32px;margin:0 4px;padding:0 8px;border-radius:var(--radius-md);font:400 14px/20px var(--font-sans)}
.r.on{background:var(--accent)}
.r svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;color:var(--muted-foreground)}
.r .h{font:400 13px/18px var(--font-sans);color:var(--muted-foreground)}
.r kbd{margin-left:auto;font:400 11px/16px var(--font-mono);padding:0 5px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--secondary);color:var(--muted-foreground)}
.ft{display:flex;gap:12px;padding:8px 12px;border-top:1px solid var(--border);font:400 12px/16px var(--font-sans);color:var(--muted-foreground)}
</style>
<div class="scrim"><div class="cp">
<div class="q"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>sus<span class="caret"></span></div>
<div class="g">ACTIONS</div>
<div class="r on"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Suspend user… <span class="h">opens confirmation</span><kbd>S</kbd></div>
<div class="r"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Suspend scheduled jobs</div>
<div class="g">GO TO</div>
<div class="r"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Audit log <span class="h">filtered: suspensions</span><kbd>G A</kbd></div>
<div class="ft"><span>↑↓ navigate</span><span>↵ select</span><span>esc close</span></div>
</div></div>
</div>
<script>/* static */</script>
